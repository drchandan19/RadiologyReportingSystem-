<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radiology Reporting System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Radiology Reporting System</h1>
        <p>Department of Radiodiagnosis, 7 Air Force Hospital</p>
    </header>

    <main>
        <div class="container">

            <h2>Select Modality</h2>

            <select id="modality">
                <option value="">-- Select Modality --</option>
                <option>Ultrasound</option>
                <option>CT</option>
                <option>MRI</option>
                <option>X-Ray</option>
                <option>Doppler</option>
            </select>
            <br><br>

<select id="studyType">
    <option value="">-- Select Study Type --</option>
    <option>Abdomen</option>
    <option>KUB</option>
    <option>Pelvis</option>
    <option>Thyroid</option>
    <option>Breast</option>
    <option>Scrotum</option>

    <option>CT Chest</option>
    <option>NCCT Head</option>
</select>
            <br><br>

            <button id="loadTemplate">
                Load Template
            </button>
<br><br>

<button id="copyReport">
    Copy Report
</button>
            <br><br>

            <textarea id="reportArea"
                rows="20"
                cols="100"
                placeholder="Report will appear here...">
            </textarea>

        </div>
    </main>

    <script src="js/script.js"></script>

</body>
</html>
